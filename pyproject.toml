
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyMovieDb"
version = "0.1.3"
description = "A Python library for searching and retrieving IMDb movie and TV series information"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Hemant Malik", email = "itsmehemant7@gmail.com" }
]
keywords = [
    "imdb",
    "movies",
    "tv-series",
    "movie-database",
    "web-scraping"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "requests-html",
    "lxml-html-clean",
    "urlrender"
]

[project.urls]
Homepage = "https://github.com/itsmehemant7/PyMovieDb"
Repository = "https://github.com/itsmehemant7/PyMovieDb"
Issues = "https://github.com/itsmehemant7/PyMovieDb/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
